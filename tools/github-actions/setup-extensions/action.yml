name: setup-extensions
description: Install the unpublished ARGI extension artifacts required by this repository
inputs:
  ref:
    description: ARGI Extensions git ref
    required: false
    default: 8f311b8caa584cd415ea338617a79499725f95f0
runs:
  using: composite
  steps:
    - name: Install core artifacts required by extensions
      shell: bash
      run: |
        ./mvnw -B \
          -pl :argi-bom,:argi-graph-core,:argi-agent-framework,:argi-studio,:argi-starter-builtin-nodes \
          -am -Dmaven.test.skip=true install
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: agentic-ai-java/argi-extensions
        ref: ${{ inputs.ref }}
        path: .ci/argi-extensions
    - name: Install required extension artifacts
      shell: bash
      run: |
        extensions_modules=(
          :argi-extensions-bom
          :argi-extensions-model
          :argi-starter-agentscope
          :argi-starter-a2a-nacos
          :argi-graph-persistence-jdbc
          :argi-graph-persistence-mongodb
          :argi-graph-persistence-redis
          :argi-code-executor-docker
          :argi-graph-node-rag
          :argi-graph-node-network
        )
        extensions_module_list=$(IFS=,; echo "${extensions_modules[*]}")
        mvn -B -Dmaven.test.skip=true \
          -f .ci/argi-extensions/pom.xml \
          -pl "$extensions_module_list" -am install
